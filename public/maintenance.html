<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance | College Website</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#0C2B4E",
                        secondary: "#1A3D64",
                        accent: "#1D546C",
                    },
                    fontFamily: {
                        display: ["Playfair Display", "serif"],
                        body: ["DM Sans", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center bg-slate-50 selection:bg-accent selection:text-white p-6">
        <div class="max-w-4xl w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row border border-primary/5">
            
            <!-- Image Section -->
            <div class="w-full md:w-1/2 bg-primary/5 p-8 flex items-center justify-center">
                <img 
                    src="/PageMaintanence.png" 
                    alt="Under Maintenance" 
                    class="w-full h-auto max-w-sm drop-shadow-xl rounded-2xl mix-blend-multiply"
                />
            </div>
            
            <!-- Content Section -->
            <div class="w-full md:w-1/2 p-10 md:p-14 flex flex-col justify-center text-center md:text-left">
                <div class="w-16 h-16 bg-accent/10 rounded-2xl flex items-center justify-center mb-6 mx-auto md:mx-0">
                    <svg class="text-accent animate-[spin_4s_linear_infinite]" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                
                <h1 class="text-4xl md:text-5xl font-display font-black text-primary mb-4 leading-tight">
                    Under <br class="hidden md:block" />Maintenance
                </h1>
                
                <div class="w-16 h-1.5 bg-accent rounded-full mb-6 mx-auto md:mx-0"></div>
                
                <p class="text-lg text-secondary/70 mb-8 leading-relaxed">
                    We are currently upgrading our systems to provide you with a better experience. 
                    The website will be back online shortly. Thank you for your patience!
                </p>
                
                <div class="bg-slate-50 border border-slate-100 rounded-xl p-5 flex items-start gap-4 text-left">
                    <svg class="text-accent shrink-0 mt-1" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                    <div>
                        <h3 class="font-bold text-primary mb-1">Need urgent assistance?</h3>
                        <p class="text-sm text-secondary/80">
                            Contact the administration at <br/>
                            <a href="mailto:principal@ceconline.edu" class="text-accent font-bold hover:underline">principal@ceconline.edu</a>
                        </p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
